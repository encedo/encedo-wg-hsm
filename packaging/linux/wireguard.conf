# /var/run/wireguard is where a running interface leaves its UAPI socket, its
# public key and its state file. It is root-owned and this client does not run as
# root, so the group is how both halves reach it: the service through
# SupplementaryGroups, and a person running `wg-hem up` by being in the group.
#
# It is also where `wg show` looks, which is why the tunnels this client runs are
# visible to the standard tool without anything being added.
d /var/run/wireguard 0770 root wireguard -
