name: CI

# This builds and verifies. It does not publish.
#
# Releases are made by hand, because the binaries are signed on a hardware token
# that cannot be handed to a runner. A tag is applied after signing, so anything
# here that reacted to a tag by uploading would be racing to publish the unsigned
# build of the very commit that was just signed. Tags still build, as a check on
# the exact commit about to be released; the artefacts are for inspection.

# gui is here as well as main. Everything this workflow checks that the GUI
# workflow does not - gofmt over cmd and internal, go vet and go test -race in
# both record dialects, and the rule that everything is plain ASCII - had not run
# once during the whole of the Windows work, because that work happens on a
# branch this did not name. The ASCII check in particular was added here and then
# cited as the reason the mistake could not come back, while never having
# executed.
on:
  push:
    branches: [main, gui]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: descr ${{ matrix.descr }} B
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both record sizes are built and tested: the length is part of what the
        # configuration MAC covers, so the two binaries cannot read each other's
        # trees and a change that suits one can break the other.
        descr: ["128", "64"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # hem-sdk-go is a submodule and go.mod resolves the SDK to it, so a
          # shallow checkout without it does not build. If the SDK repository is
          # private, GITHUB_TOKEN cannot read it - add a SUBMODULE_TOKEN secret
          # holding a PAT with read access to encedo/hem-sdk-go.
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # This clones upstream wireguard-go and overlays our four files onto it.
      # go.mod points golang.zx2c4.com/wireguard at that directory, so nothing
      # compiles before it has run - not the tests, not even `go vet`.
      - name: Build
        env:
          WG_HEM_DESCR: ${{ matrix.descr }}
        run: ./build.sh

      # Windows needs wintun.dll beside the executable or the tunnel fails at
      # the moment it is created. Its licence permits redistribution alongside
      # software using only the documented API, which is what this is, so the
      # driver ships in the same archive rather than being a step in a README.
      - name: Package the Windows bundles
        env:
          WG_HEM_DESCR: ${{ matrix.descr }}
        run: ./package-windows.sh

      # Everything this repository builds or runs is plain ASCII, and it is
      # checked rather than intended.
      #
      # PowerShell 5.1 reads a .ps1 with no byte-order mark as ANSI, not UTF-8.
      # An em dash then arrives as three CP-1252 characters, the last of which is
      # a right double quotation mark, and inside a double-quoted string that
      # closes the string. install.ps1 shipped that way: it parsed as far as the
      # first dash and produced four errors, none of which mentioned encoding.
      #
      # Go is UTF-8 by definition so its comments were never at risk, but its
      # string literals reach a Windows console, and a console on a Polish
      # install is not UTF-8 either. The same dash that broke the installer was
      # printing as garbage in wg-hem's own output.
      #
      # So the rule is the whole tree rather than the file type that failed:
      # simple enough to remember, and checkable in one line. A byte-order mark
      # would have fixed only the first half, and can be stripped by an editor or
      # a merge without anything saying so.
      #
      # A carriage return is allowed and is not an oversight: the .ps1 files are
      # checked out with CRLF on purpose, being the only thing here that runs on
      # Windows alone. The first version of this check forbade it and would have
      # failed on the two files it was written to protect.
      #
      # hem-sdk-go is excluded because it is a submodule with its own repository
      # and its own checks; what it prints has been made ASCII there.
      - name: Everything must be plain ASCII
        run: |
          # tr and not grep, because there is no one regular expression that
          # means the same thing in every grep. The first version of this used
          # a bracket expression with \t and \r in it, passed on the machine it
          # was written on - which turned out to have ugrep installed as grep,
          # where those are escapes - and failed here, where GNU grep reads them
          # as four literal characters. Deleting the bytes that are allowed and
          # looking at what is left needs no dialect at all.
          #
          # Kept: tab, carriage return, and printable ASCII. Newline survives
          # the deletion and is then eaten by the command substitution, so a
          # clean file leaves an empty string.
          #
          # git ls-files rather than a walk, so this sees tracked files only: no
          # generated wireguard-go tree, and a submodule appears as one entry
          # rather than as its contents, which is right because it has its own
          # rules.
          bad=""
          for f in $(git ls-files '*.go' '*.sh' '*.ps1' '*.yml' '*.yaml'); do
            if [ -n "$(LC_ALL=C tr -d '\11\15\40-\176' < "$f")" ]; then
              bad="$bad $f"
            fi
          done
          if [ -n "$bad" ]; then
            echo "These files contain characters that do not survive a Windows console:"
            for f in $bad; do
              # The characters themselves, one per line, deduplicated. No
              # pattern is matched to find them: what is left after deleting
              # everything allowed is exactly what is wrong.
              printf '%s: ' "$f"
              LC_ALL=C tr -d '\11\15\40-\176' < "$f" | tr -d '\n' | fold -w1 | sort -u | tr '\n' ' '
              echo
            done
            exit 1
          fi

      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd/ internal/)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ${{ matrix.descr == '64' && '-tags descr64' || '' }} ./...

      # -race needs cgo, which build.sh disables per-command for the release
      # binaries only, so it is available here.
      - name: Test
        run: go test ${{ matrix.descr == '64' && '-tags descr64' || '' }} -race ./...

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: wg-hem-descr${{ matrix.descr }}
          path: dist/
          retention-days: 14
