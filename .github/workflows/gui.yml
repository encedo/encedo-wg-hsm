name: GUI

# The skeleton exists to find out whether it builds and runs on all three
# platforms before any of it touches a device, so this is the point of it. It
# builds and does not publish, like the other workflow, and it is scoped to the
# gui/ module: a change to the CLI cannot break it and does not run it.

# There is no paths filter, and there used to be: ["gui/**", this file]. It was
# right when this job built only the window, and wrong from the moment the job
# started assembling the whole Windows bundle. It now builds cmd/wg-hem, reads
# the driver's version and checksum out of package-windows.sh, calls build.sh to
# lay down the patched upstream tree, stamps with scripts/version.sh, and copies
# packaging/windows and LICENSE - so the honest filter is most of the repository,
# and a nine-pattern list is one somebody forgets to extend.
#
# It was forgotten already: a fix to install.ps1 was pushed and nothing ran,
# which reads as a broken runner rather than as a filter doing its job.
on:
  push:
    branches: [gui]
    # A tag is a release, and a release is the one build that gets signed. The
    # sign job at the end of this file is what a tag adds; the build itself is
    # the same one every push gets.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: >-
          Sign the Windows build with the company certificate. The run waits
          for a reviewer before anything is signed.
        type: boolean
        default: false

# Read-only for the build. The one job that needs more - the sign job asks
# GitHub for an OIDC token - says so itself, so the permission exists only where
# it is spent.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm was added on 2026-08-15, taken out the same day, and
        # is back on 2026-09-17 because the product supports the whole Windows
        # 11 line rather than the half of it that runs x64.
        #
        # What removed it was real and has not gone away: the runner image
        # still provisions only i686 and x86_64 mingw (its own
        # Install-Mingw64.ps1 asks niXman/mingw-builds-binaries for those two
        # and no other), so the `gcc` on PATH there is an x86-64 compiler under
        # emulation. cgo hands it the arm64 assembly in runtime/cgo and it
        # answers `no such instruction: stp x29,x30`, which is the failure an
        # empty main.go importing "C" would produce. What changed is not the
        # image but that the step below puts a native aarch64 toolchain on the
        # runner before anything is compiled.
        #
        # The window is why this needs a runner of its own. cgo cannot be
        # cross-compiled the way the component can, so the window's
        # architecture is the runner's; the component is CGO_ENABLED=0 and is
        # built beside it here for the same reason it is on x64, that one
        # checkout and one call to scripts/version.sh is what keeps the two
        # halves' stamps from disagreeing.
        #
        # One thing this build cannot answer, and it should be tested on real
        # hardware before an arm64 installer is handed to anyone: Fyne picks
        # its painter by architecture, so a windows/arm64 build asks for OpenGL
        # ES over WGL and fails at window creation where the driver has no
        # WGL_EXT_create_context_es2_profile. That is fyne-io/fyne#6483, open
        # upstream since 2026-08-17 with a fallback proposed in #6484. A
        # headless runner compiles it either way and says nothing.
        # ubuntu-24.04-arm builds the Linux window and the .deb for arm64.
        # The window needs cgo, so its architecture is the runner's and cannot
        # be cross-compiled the way the command-line client is: until GitHub
        # offered free arm64 Linux runners to public repositories there was no
        # way to produce one here, and an arm64 package came from reinstall.sh
        # on the machine that wanted it. There is now, and the dev machine is
        # arm64, so the package it needs should not be the one nobody builds.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest,
            windows-11-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The submodule is not reachable from here yet - the session is faked,
          # so gui/ imports nothing from the core and the SDK never enters the
          # build. Fetching it anyway keeps this identical to a developer's
          # checkout, and it becomes load-bearing the moment the fake is
          # replaced. If the SDK repository is private, GITHUB_TOKEN cannot read
          # it and a SUBMODULE_TOKEN secret is needed.
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum

      # A GUI toolkit needs cgo, and cgo on Linux needs headers - for both
      # display servers, because GLFW compiles an X11 backend and a Wayland one
      # into the same binary and chooses at run time. Leaving either set out
      # fails the build on a machine that would never have used that backend.
      #
      # Two of these are worth naming because each cost a red build, and because
      # a developer's machine has them and so gives no warning. libxxf86vm-dev
      # surfaces only at the link step, as "cannot find -lXxf86vm"; libwayland-dev
      # surfaces during compilation, as a missing wayland-client-core.h.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config \
            libgl1-mesa-dev xorg-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      # The native aarch64 toolchain the runner does not have. See the matrix
      # comment for what is on it instead and what that costs.
      #
      # llvm-mingw rather than MSYS2's CLANGARM64: one pinned archive with a
      # checksum, against a package database that moves underneath a pinned
      # version. It is the same treatment wintun.dll gets a few steps below and
      # for a stronger reason - this one compiles the binary we sign.
      #
      # Relative paths and `pwd -W`, both deliberate. An absolute path written
      # by git-bash means nothing to the Go toolchain, which is a Windows
      # program: `pwd -W` is what turns /d/a/... into D:/a/..., and CC has to be
      # the second. Unpacked beside the checkout rather than inside it, so that
      # 600 MB of compiler is not something the upload step has to be told to
      # leave out.
      - name: Windows ARM64 build dependencies
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: bash
        run: |
          set -eu
          ver=20260908
          sum=7fe35f60407473c420ac72b25137f54385b0affd2c42efd507c0062fc626ab56
          zip=llvm-mingw-$ver-ucrt-aarch64.zip
          work=../_toolchain
          rm -rf "$work"; mkdir -p "$work"
          curl -sSLf -o "$work/$zip" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/$zip"
          echo "$sum  $work/$zip" | sha256sum -c -
          powershell -NoProfile -Command "Expand-Archive -Force '$work/$zip' '$work/x'"

          bin="$(cd "$work/x/llvm-mingw-$ver-ucrt-aarch64/bin" && pwd -W)"
          # Said out loud, because a CC that is not there is a cgo build that
          # falls back to the emulated gcc and fails much later and worse.
          "$bin/aarch64-w64-mingw32-gcc.exe" --version | head -1
          {
            echo "CC=$bin/aarch64-w64-mingw32-gcc.exe"
            echo "CXX=$bin/aarch64-w64-mingw32-g++.exe"
          } >> "$GITHUB_ENV"

      - name: gofmt
        working-directory: gui
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        working-directory: gui
        run: go vet ./...

      # cgo means one build per operating system: the compilers and SDKs cannot
      # be crossed the way the CLI's can. macOS is the exception in the other
      # direction - one runner holds both architectures' SDKs, so it produces
      # both. Windows on arm64 would need its own toolchain and is not built.
      - name: Build
        working-directory: gui
        shell: bash
        run: |
          set -eu
          mkdir -p ../dist-gui

          # The same stamp build.sh puts on the command-line client, from the
          # same script. The window and the privileged component refuse to drive
          # each other unless these match - deliberately, since a mismatched pair
          # fails later and worse - so a window built without it can never talk
          # to a component that has one.
          VERSION="$(cd .. && sh scripts/version.sh)"
          STAMP="-X github.com/encedo/encedo-wg-hsm/internal/version.Version=$VERSION"
          echo "version: $VERSION"

          # Written down beside the binaries, for the job that packages them
          # somewhere else. The sign job checks this tree out afresh and builds
          # the installer from downloaded executables; the stamp the installer
          # records has to be theirs rather than whatever that checkout computes
          # for itself. build-msi.sh reads it from here.
          echo "$VERSION" > ../dist-gui/VERSION

          # Both record dialects, as build.sh does for the command-line client.
          # The window reads the configuration itself, so a 128-byte build against
          # 64-byte firmware fails at MAC verification - which looks exactly like
          # somebody having tampered with the configuration. Shipping only one
          # size is how that happens to a person rather than to a test.
          # $1 is the dialect suffix, $2 anything extra for the linker, the rest
          # goes to go build. One -ldflags, composed here, because passing two
          # silently keeps only the last.
          build() {
            local suffix="$1" extra="$2"; shift 2
            case "$suffix" in
              "")        local tags="" ;;
              -descr64)  local tags="descr64" ;;
            esac
            CGO_ENABLED=1 go build ${tags:+-tags "$tags"} -ldflags "$STAMP $extra" "$@"
          }

          for variant in "" "-descr64"; do
            case "${{ runner.os }}" in
              Linux)
                # The runner's own architecture, because cgo builds for the
                # machine it runs on. Two Linux jobs, one per architecture.
                case "${{ runner.arch }}" in
                  X64)   goarch=amd64 ;;
                  ARM64) goarch=arm64 ;;
                esac
                GOARCH="$goarch" build "$variant" "" \
                  -o "../dist-gui/encedo-wg-gui-linux-$goarch$variant" .

                # The component beside the window, for the same reason it is
                # built beside it on Windows: build-deb.sh needs both, they
                # refuse each other unless their stamps agree, and two workflows
                # producing them is how the stamps come to differ. From the
                # repository root, because gui/ is its own module.
                #
                # The patched upstream tree first. The component imports
                # wireguard-go and go.mod resolves that to ./wireguard-go, which
                # only build.sh produces - and the first version of this asked
                # for it in the packaging step, which runs after this one. The
                # build failed with "replacement directory ./wireguard-go does
                # not exist" while the step that would have created it sat two
                # steps below. The Windows branch had it in the right place; the
                # two are now the same.
                # ./build.sh, not `sh build.sh`. It declares bash and uses
                # `set -o pipefail`, and sh on Ubuntu is dash, which answers
                # "Illegal option -o pipefail" and stops. It ran on the Windows
                # runner because sh there is git-bash. Letting the shebang decide
                # means nobody has to remember which script wants which shell.
                if [ ! -d ../wireguard-go/device ]; then
                  ( cd .. && WG_PREPARE_ONLY=1 ./build.sh )
                fi
                case "$variant" in
                  "")        cli_tags="" ;;
                  -descr64)  cli_tags="descr64" ;;
                esac
                ( cd .. && CGO_ENABLED=0 GOARCH="$goarch" go build ${cli_tags:+-tags "$cli_tags"} \
                    -ldflags "$STAMP" \
                    -o "dist/wg-hem-linux-$goarch$variant" ./cmd/wg-hem )
                ;;
              macOS)
                for arch in arm64 amd64; do
                  GOARCH="$arch" build "$variant" "" \
                    -o "../dist-gui/encedo-wg-gui-darwin-$arch$variant" .
                done
                ;;
              Windows)
                # The icon and version resource, compiled into the window.
                #
                # Windows reads the icon for Explorer, the task bar and a Start
                # menu shortcut out of the executable, never from the running
                # program - which is why the tray icon was right and the other
                # three were generic. The version goes in with it, so the file
                # can say what it is without being run.
                #
                # -platform-specific writes resource_windows_<arch>.syso, which
                # is the naming Go already applies GOOS and GOARCH rules to, so
                # the right one is linked and the rest are ignored. Generated
                # rather than committed: it carries the stamp, which changes
                # every commit.
                #
                # Run from here, which is gui/, and that is the whole of what
                # went wrong the first time. -platform-specific ignores -o and
                # writes into the working directory, so wrapping this in a
                # subshell that stepped up to the repository root put four .syso
                # files where nothing links them. Go only takes them from the
                # directory of the package being built, so the window came out
                # with no icon and nothing said a word.
                # The record size, spelled out rather than composed from the
                # suffix. `${variant:+64}${variant:-128}` looks like it says
                # "64 when there is a suffix, 128 when there is not" and does
                # not: the second expansion yields the suffix itself, so the
                # 64-byte build called itself "descr 64-descr64 B" in the file
                # properties every time.
                case "$variant" in
                  "")        descr_bytes=128 ;;
                  -descr64)  descr_bytes=64  ;;
                esac
                go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1 \
                    -icon packaging/icon.ico \
                    -product-version "$VERSION (descr $descr_bytes B)" \
                    -platform-specific \
                    packaging/versioninfo.json

                # Said out loud, because the failure above was silent: a missing
                # resource is a build that succeeds and an icon that is not
                # there, found days later by somebody looking at a Start menu.
                ls resource_windows_*.syso >/dev/null 2>&1 || {
                  echo "goversioninfo produced no .syso in $(pwd)" >&2; exit 1; }
                # Whatever the runner is, natively: cgo means no cross-building,
                # so the ARM64 runner produces the ARM64 window and the x64 one
                # produces x64. runner.arch is the only thing that distinguishes
                # the two jobs, since both call themselves Windows.
                case "${{ runner.arch }}" in
                  X64)   goarch=amd64 ;;
                  ARM64) goarch=arm64 ;;
                  *)     echo "unknown runner architecture ${{ runner.arch }}" >&2; exit 1 ;;
                esac
                # -H=windowsgui suppresses the console window that would otherwise
                # open behind the interface. Without it every launch shows a black
                # rectangle nobody asked for.
                GOARCH=$goarch build "$variant" "-H=windowsgui" \
                  -o "../dist-gui/encedo-wg-gui-windows-$goarch$variant.exe" .

                # The component beside the window, from this tree and this
                # stamp. It is built in ci.yml too, and that is not the same
                # thing: the two halves refuse each other unless their stamps
                # agree, and two workflows mean two artifacts somebody has to
                # pair up by hand from runs they have to match by commit. That
                # went wrong the first time it was tried. Built here they cannot
                # disagree, because there is one checkout and one call to
                # scripts/version.sh behind both.
                #
                # CGO_ENABLED=0 as build.sh uses for it: the component needs no
                # C and a static one starts anywhere.
                #
                # The patched upstream tree has to exist first. The component
                # imports wireguard-go and go.mod resolves that to ./wireguard-go,
                # which build.sh clones and patches - so this asks build.sh for
                # exactly that and nothing else. Once per job, not once per
                # variant.
                if [ ! -d ../wireguard-go/device ]; then
                  ( cd .. && WG_PREPARE_ONLY=1 ./build.sh )
                fi
                case "$variant" in
                  "")        cli_tags="" ;;
                  -descr64)  cli_tags="descr64" ;;
                esac
                # From the repository root, not from here. gui/ is its own
                # module with its own go.sum, and that go.sum has no entry for
                # wireguard-go and must not gain one - deps_test.go exists to
                # keep the tunnel out of the window. Building the component from
                # inside gui/ resolves it against the wrong module and fails
                # with six missing go.sum entries, which is the right answer to
                # the wrong question.
                ( cd .. && CGO_ENABLED=0 GOARCH=$goarch go build ${cli_tags:+-tags "$cli_tags"} \
                    -ldflags "$STAMP" \
                    -o "dist-gui/wg-hem-windows-$goarch$variant.exe" ./cmd/wg-hem )
                ;;
            esac
          done
          ls -l ../dist-gui

      # Not signed here, and this is where it once was. Signing needs an OIDC
      # token that Azure exchanges only for a job running in the "release"
      # environment, and that environment waits for a reviewer - so putting it
      # on this job would put every push to the branch behind a person. The
      # build stays unsigned and ungated; the sign job at the end of this file
      # takes what this one uploads, on a tag or on request.

      # Temporary, and it ships nowhere. The window is linked -H=windowsgui, so
      # it has no console and Fyne's startup errors go nowhere anybody can read
      # them - which is exactly the state Windows 11 ARM left us in on
      # 2026-09-17: the tray icon appears, the window does not, and redirecting
      # stderr from PowerShell produced empty files.
      #
      # This is the same window linked as a console program, so that running it
      # in a terminal prints whatever Fyne says. It goes to its own directory
      # and its own artifact rather than into dist-gui, so that it cannot be
      # mistaken for something to install and cannot be swept up by the signing
      # job, which signs every .exe it finds. Delete both steps once the cause
      # is known.
      - name: A console build of the window, for diagnosis only
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        working-directory: gui
        shell: bash
        run: |
          set -eu
          mkdir -p ../dist-diag
          VERSION="$(cd .. && sh scripts/version.sh)"
          CGO_ENABLED=1 GOARCH=arm64 go build -tags descr64 \
            -ldflags "-X github.com/encedo/encedo-wg-hsm/internal/version.Version=$VERSION" \
            -o ../dist-diag/encedo-wg-gui-windows-arm64-console.exe .
          ls -l ../dist-diag

      - name: Upload the diagnostic build
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        uses: actions/upload-artifact@v4
        with:
          name: encedo-wg-gui-ARM64-console-diagnostic
          path: dist-diag/
          retention-days: 7

      # A bundle somebody can install, rather than four files and a paragraph.
      # Assembled here because this is the only job that holds both halves - the
      # window needs cgo and the component must carry the same stamp - and
      # because the driver has to come with them or the tunnel fails at the
      # moment it is created.
      - name: Bundle
        if: runner.os == 'Windows'
        shell: bash
        working-directory: gui
        run: |
          set -eu
          # One source of truth for both, read out of the script that has always
          # owned them. A second copy of a checksum is a second thing to forget.
          ver="$(sed -n 's/^WINTUN_VERSION="\(.*\)"$/\1/p' ../package-windows.sh)"
          sum="$(sed -n 's/^WINTUN_SHA256="\(.*\)"$/\1/p' ../package-windows.sh)"
          case "${{ runner.arch }}" in
            X64)   goarch=amd64 ;;
            ARM64) goarch=arm64 ;;
          esac

          # Relative, and under dist-gui, for one reason: this step is bash and
          # the next line is PowerShell, and the two do not agree on what a path
          # is. An absolute /tmp/... is a real place to git-bash, which maps it
          # into the MSYS tree, and nowhere at all to PowerShell - which is
          # exactly how this failed the first time, after the download and the
          # checksum had both succeeded. A relative path is resolved by each
          # against the same working directory and means the same thing to both.
          work=../dist-gui/_wintun
          rm -rf "$work"; mkdir -p "$work"

          curl -sSLf -o "$work/wintun.zip" "https://www.wintun.net/builds/wintun-${ver}.zip"
          # Verified rather than trusted: this is redistributed to users, and a
          # driver is the last thing to take on faith from a URL.
          echo "${sum}  $work/wintun.zip" | sha256sum -c -
          # Expand-Archive rather than unzip, which is not on every Windows
          # runner image; PowerShell 5 is.
          powershell -NoProfile -Command "Expand-Archive -Force '$work/wintun.zip' '$work/x'"

          for variant in "" "-descr64"; do
            stage="../dist-gui/encedo-wg-windows-$goarch$variant"
            mkdir -p "$stage"
            # Renamed to the plain names on the way in. The suffixes exist to
            # keep dialects apart in a build directory; inside an installation
            # they would only be something to get wrong.
            cp "../dist-gui/wg-hem-windows-$goarch$variant.exe"        "$stage/wg-hem.exe"
            cp "../dist-gui/encedo-wg-gui-windows-$goarch$variant.exe" "$stage/encedo-wg-gui.exe"
            cp "$work/x/wintun/bin/$goarch/wintun.dll"                 "$stage/wintun.dll"
            cp ../packaging/windows/install.ps1                        "$stage/"
            # The icon as a file as well as a resource: the installer points the
            # notification registration at it, and Windows wants an image there
            # rather than an executable.
            cp packaging/icon.ico                                      "$stage/"
            cp ../packaging/windows/uninstall.ps1                      "$stage/"
            cp ../LICENSE                                              "$stage/LICENSE.txt"
            cp "$work/x/wintun/LICENSE.txt"                            "$stage/WINTUN-LICENSE.txt"
          done

          # Out of the way before the upload: it lives under dist-gui so that it
          # is ignored by git and cleaned by the same rule as everything else
          # here, not so that it ships.
          rm -rf "$work"
          ls -R ../dist-gui

      # The Debian package, for the same reason the MSI exists: one file, and
      # built where both halves are, from one tree and one stamp.
      #
      # It was not built here at all until now - only by hand on a developer's
      # machine through reinstall.sh - which left Linux with nothing to download
      # while Windows had an installer. build-deb.sh refuses a mismatched pair
      # itself, so this is also a check on the two builds above.
      #
      # One package per architecture, from the job that built that architecture:
      # the window is cgo and cannot be cross-compiled, so a .deb is only ever
      # built where its own halves were.
      - name: Package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          case "${{ runner.arch }}" in
            X64)   goarch=amd64 ;;
            ARM64) goarch=arm64 ;;
          esac
          # No prepare here: the build step above has already laid down the
          # patched upstream tree, because that is where the component is built.
          for variant in "" "-descr64"; do
            sh packaging/linux/build-deb.sh "$goarch" "$variant"
          done
          ls -l dist-deb/

      - name: Upload the Debian packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          # The architecture is in the name for the reason it is in the window's:
          # two Linux jobs would otherwise both upload as "encedo-wg-deb" and the
          # second would be refused.
          name: encedo-wg-deb-${{ runner.arch }}
          path: dist-deb/
          retention-days: 7

      # The installer: one file to download and double-click. A script rather
      # than a step, because the sign job builds it a second time once the
      # binaries carry a signature and the two must not drift. The script says
      # why only the descr64 dialect gets one and why this has to be Windows.
      - name: Installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          case "${{ runner.arch }}" in
            X64)   goarch=amd64 ;;
            ARM64) goarch=arm64 ;;
          esac
          packaging/windows/build-msi.sh "$goarch" "${{ github.run_number }}"

      # Windows 10 is one of the machines this ships to, and "will it start
      # there" is answered by the PE header rather than by where it was built.
      # Two fields say it: the minimum operating system version and the
      # subsystem version, both in the optional header. Go asks for 6.1 today -
      # Windows 7 - so there is enormous room, and that is exactly why this is
      # worth pinning: a linker flag or a toolchain change could raise it, the
      # artifact would still build and upload, and the first anyone would know is
      # a machine refusing to run it with a message about the wrong version of
      # Windows.
      - name: The window must still start on Windows 10
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem ../dist-gui/*.exe | ForEach-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            if ([Text.Encoding]::ASCII.GetString($b, $pe, 2) -ne 'PE') {
              throw "$($_.Name): no PE signature where the DOS header points"
            }
            $opt   = $pe + 24
            $osMaj = [BitConverter]::ToUInt16($b, $opt + 40)
            $osMin = [BitConverter]::ToUInt16($b, $opt + 42)
            $ssMaj = [BitConverter]::ToUInt16($b, $opt + 48)
            $ssMin = [BitConverter]::ToUInt16($b, $opt + 50)
            "{0}: minimum OS {1}.{2}, subsystem {3}.{4}" -f $_.Name, $osMaj, $osMin, $ssMaj, $ssMin
            # 10.0 is Windows 10. Anything above it is a binary that will not
            # start on one of the machines this is for.
            foreach ($v in @(@($osMaj, $osMin), @($ssMaj, $ssMin))) {
              if ($v[0] -gt 10 -or ($v[0] -eq 10 -and $v[1] -gt 0)) {
                Write-Error "$($_.Name) demands Windows $($v[0]).$($v[1]), later than Windows 10"
                $bad = $true
              }
            }
          }
          if ($bad) { exit 1 }
        working-directory: gui

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          # The architecture is in the name because two Windows jobs would
          # otherwise both upload as "Windows" and the second would be refused.
          name: encedo-wg-gui-${{ runner.os }}-${{ runner.arch }}
          path: dist-gui/
          retention-days: 7

  # Signing, in a job of its own and behind a person.
  #
  # It could not stay in the build job, and the reason is the credential. There
  # is no key: the job asks GitHub for an OIDC token, Azure exchanges it for the
  # right to use the certificate, and the federated credential on the Azure side
  # accepts that token only when its subject names this repository *and* the
  # "release" environment. A job outside the environment gets a token Azure
  # refuses - AADSTS700213, "no matching federated identity record". The
  # environment in turn waits for a reviewer, so a job inside it waits too, which
  # is right for a release and wrong for every push to the branch. Hence a job of
  # its own: the build runs as it always has, this one runs on a tag or when
  # asked, and the reviewer approves exactly one thing, the signing.
  #
  # A pull request never reaches this, from a fork or otherwise: the condition
  # names the two events that may, and pull_request is not one of them. Anything
  # looser would let a PR produce a file signed in the company's name.
  #
  # What it signs is what the build uploaded, in the order RELEASING.md gives:
  # the executables first, every copy of them, then the installer is rebuilt
  # from the signed copies and signed itself. An installer embeds its payload,
  # so signing the one the build made would wrap a signature around unsigned
  # binaries - exactly the case Defender looks inside for.
  #
  # Both architectures, in one job on an x64 runner. The signing action does
  # not run on Windows ARM runners, and it does not need to: a signature is
  # over the bytes of a file and does not care what machine type the header
  # declares. What an x64 runner cannot do is *execute* an arm64 binary -
  # Windows emulates x64 on ARM and not the other way round - which is the one
  # thing build-msi.sh had to be taught.
  sign:
    name: Sign for Windows
    needs: build
    # Spelled out rather than implied: a job with an `if` of its own loses the
    # default success() check, so the build's result has to be named here or a
    # red build could be signed.
    if: >-
      needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.sign))
    runs-on: windows-latest
    # The name is part of the credential. The federated credential in Azure
    # matches the OIDC subject character for character, and the subject is
    # repo:encedo/encedo-wg-hsm:environment:release. Rename this, or the
    # repository, and every attempt fails at login with AADSTS700213.
    environment: release
    permissions:
      contents: read
      # The OIDC token. Requested here and nowhere else: nothing in the
      # repository holds a credential, and no other job could spend one.
      id-token: write

    steps:
      # The tree, for what the installer is built from: the WiX authoring, the
      # version script and build-msi.sh. No submodule, since nothing is compiled
      # here; build-msi.sh checks that the stamp this checkout computes is the
      # one inside the binaries, so a checkout that described itself differently
      # would stop there rather than ship a mismatched installer.
      - name: Checkout
        uses: actions/checkout@v4

      # Both Windows jobs' output, unsigned, merged into one directory: per
      # architecture four executables, the two staged bundles that copy them,
      # and an installer this job replaces. They cannot collide, because every
      # file either carries its architecture in its name or is the VERSION
      # file, which both jobs wrote and both wrote the same.
      - name: Download the unsigned builds
        uses: actions/download-artifact@v4
        with:
          pattern: encedo-wg-gui-Windows-*
          merge-multiple: true
          path: dist-gui

      # Exact versions for the two actions that handle the credential, where the
      # rest of this file follows a major tag. These are the steps that can sign
      # something in the company's name; what they run should change when
      # somebody changes it here, not when a tag moves upstream.
      #
      # A client id and no secret is the OIDC flow: the action asks GitHub for
      # the token and exchanges it. Do not add a secret to this.
      - name: Sign in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Microsoft renamed the service from Trusted Signing to Artifact Signing
      # in 2026 and the action with it; azure/trusted-signing-action is now a
      # redirect to this one. The inputs kept their shape and the repository
      # variables kept their names.
      #
      # Recursive, deliberately: the staged bundles hold copies of the loose
      # executables, and the copies are what a person installs. Signing only the
      # loose ones would ship two downloads of one program where only one is
      # signed, which is worse than neither. This is also what covers the second
      # architecture, since both builds unpacked into the same directory.
      # wintun.dll is not touched - it is WireGuard LLC's, signed by them, and
      # redistributed as it came.
      #
      # The timestamp is not decoration. An Artifact Signing certificate lives
      # about three days and is renewed daily, so a signature without one stops
      # verifying within the week; with one it outlives the certificate.
      - name: Sign the executables
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist-gui
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Again, from the same stages, now that what they embed is signed. The
      # same script and the same run number as the build jobs used, so each
      # result differs from its unsigned installer in exactly the signatures.
      #
      # Both are built here, on x64, including the arm64 one: `wix build -arch`
      # names the platform the package declares rather than one the host has to
      # match. What the host cannot do is run the arm64 component to ask its
      # version, which is why build-msi.sh checks the recorded stamp instead
      # when the two architectures differ. This is the first run that builds an
      # arm64 database anywhere but on an arm64 runner; if WiX turns out to
      # object, the ARM build job makes its own and this loop drops back to
      # amd64.
      - name: Rebuild the installers around the signed binaries
        shell: bash
        run: |
          set -eu
          for goarch in amd64 arm64; do
            packaging/windows/build-msi.sh "$goarch" "${{ github.run_number }}"
          done

      - name: Sign the installer
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist-gui
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Checked with the tool a Windows machine would use, not with the action's
      # exit code. signtool verify /pa applies the ordinary Authenticode policy -
      # the chain has to reach a root the machine trusts - and /v prints the
      # chain and the timestamp, which makes this run's log the record of what
      # was signed and by whom. Every executable and the installer, the copies
      # inside the bundles included, and each has to carry a timestamp or it is
      # a signature with a week to live.
      - name: Every signature must verify and carry a timestamp
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "no signtool.exe in the Windows Kits on this runner" }
          "using $($signtool.FullName)"
          $files = @(Get-ChildItem dist-gui -Recurse -Include *.exe, *.msi)
          if (-not ($files | Where-Object Extension -eq '.msi')) { throw "no installer to verify" }
          $bad = 0
          foreach ($f in $files) {
            $out = & $signtool.FullName verify /pa /v $f.FullName 2>&1 | Out-String
            $out
            if ($LASTEXITCODE -ne 0) {
              Write-Error "$($f.FullName): the signature does not verify"; $bad++
            } elseif ($out -notmatch 'The signature is timestamped') {
              Write-Error "$($f.FullName): signed but not timestamped"; $bad++
            }
          }
          "$($files.Count) files verified, $bad bad"
          if ($bad) { exit 1 }

      # After signing, because signing changes the file. Over the loose files
      # only: the bundles are directories, and a directory has no checksum.
      - name: SHA256SUMS
        shell: bash
        run: |
          set -eu
          cd dist-gui && sha256sum *.exe *.msi | tee SHA256SUMS

      # A name the unsigned upload cannot be mistaken for, and a longer life
      # than the build's: this is what a release is made from, and a release is
      # not always made the same afternoon.
      - name: Upload the signed build
        uses: actions/upload-artifact@v4
        with:
          name: encedo-wg-windows-signed
          path: dist-gui/
          retention-days: 30
