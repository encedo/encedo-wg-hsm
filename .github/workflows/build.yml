name: Build

# The product on every platform it ships to: the window (GUI) and the
# command-line clients (CLI), for Linux, macOS and Windows, each for amd64 and
# arm64. Six cells, and every cell is built the same way: its own CLI, its own
# window, its own package, from one checkout and one stamp.
#
# Not run on its own: ci.yml calls it on every push to compile the lot, and
# release.yml calls it on a tag with `package` set to produce what goes into
# the release. One file, so the build a release is made from is the build every
# push has already been through.
#
# Why a runner per cell rather than one machine: the window links a GUI
# toolkit through cgo, and cgo builds for the machine it runs on. The CLI is
# CGO_ENABLED=0 and could be crossed from anywhere, but it is built in the same
# cell as the window it ships with, because the two refuse each other unless
# their stamps agree and one checkout is what keeps them agreeing. macOS is the
# one place a runner holds both architectures' SDKs, so both darwin cells run
# on the same kind of runner.
#
# What each cell leaves behind, under one artifact `encedo-wg-<os>-<arch>`:
#
#   dist/      wg-hem and wg-quick-encedo for the cell      (all)
#   dist-gui/  the window, VERSION                           (all)
#              encedo-wg-windows-<arch>/ and the .msi        (windows)
#   dist-deb/  encedo-wg_<version>_<arch>.deb                (linux)
#   dist-diag/ the window linked as a console program        (windows)
on:
  workflow_call:
    inputs:
      package:
        description: >-
          Also assemble and upload the packages and the binaries. Off, every
          cell compiles and checks and uploads nothing.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, runner: ubuntu-24.04 }
          # Free arm64 Linux runners for public repositories; the window is
          # cgo, so without one there is no arm64 .deb.
          - { goos: linux,   goarch: arm64, runner: ubuntu-24.04-arm }
          # One runner kind for both: Apple's clang carries both SDKs, so the
          # amd64 window is a GOARCH away on the arm64 runner.
          - { goos: darwin,  goarch: amd64, runner: macos-latest }
          - { goos: darwin,  goarch: arm64, runner: macos-latest }
          - { goos: windows, goarch: amd64, runner: windows-latest }
          # Native since 2026-11-10. The window opens on Snapdragon hardware
          # and fails only in the ARM virtual machine on a Mac, whose display
          # driver gives native arm64 processes no OpenGL at all
          # (`APIUnavailable: WGL: ...`) - see docs/WINDOWS.md. Until then the
          # arm64 installer carried the emulated x64 window, which meant one
          # cell packaging another's binary; the console copy in dist-diag/ is
          # how to read what the window says on a machine where it does not
          # open.
          - { goos: windows, goarch: arm64, runner: windows-11-arm }

    env:
      # Not GOOS/GOARCH: those would also steer `go run`, and on the
      # darwin-amd64 cell a tool built for amd64 needs Rosetta to start.
      TARGET_OS: ${{ matrix.goos }}
      TARGET_ARCH: ${{ matrix.goarch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # hem-sdk-go is a submodule and go.mod resolves the SDK to it. If the
          # SDK repository is private, GITHUB_TOKEN cannot read it - a
          # SUBMODULE_TOKEN secret with read access is needed.
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
          # The whole history, tags included: scripts/version.sh stamps the
          # binaries and the .deb with `git describe`, which in a shallow
          # checkout without tags can only print the commit hash.
          fetch-depth: 0

      # gui/ is its own module, but its Go version is the root's; both go.sums
      # feed the cache.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: |
            go.sum
            gui/go.sum

      # A GUI toolkit needs cgo, and cgo on Linux needs headers - for both
      # display servers, because GLFW compiles an X11 backend and a Wayland one
      # into the same binary and chooses at run time. Two of these each cost a
      # red build and are present on any developer's machine: libxxf86vm-dev
      # fails only at the link step ("cannot find -lXxf86vm"), libwayland-dev
      # as a missing wayland-client-core.h.
      - name: Linux build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config \
            libgl1-mesa-dev xorg-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      # The Windows ARM runner image provisions only x86 and x64 mingw, so the
      # `gcc` on PATH is an x86-64 compiler under emulation, and cgo handed the
      # arm64 runtime/cgo assembly answers `no such instruction: stp x29,x30`.
      # This puts a native aarch64 toolchain there first.
      #
      # llvm-mingw rather than MSYS2's CLANGARM64: one pinned archive with a
      # checksum, against a package database that moves under a pinned version.
      # It compiles the binary we sign.
      #
      # `pwd -W` turns git-bash's /d/a/... into D:/a/..., which is what the Go
      # toolchain, a Windows program, can read. Unpacked beside the checkout so
      # that 600 MB of compiler is never in an upload path.
      - name: Windows ARM64 build dependencies
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        shell: bash
        run: |
          set -eu
          ver=20260908
          sum=7fe35f60407473c420ac72b25137f54385b0affd2c42efd507c0062fc626ab56
          zip=llvm-mingw-$ver-ucrt-aarch64.zip
          work=../_toolchain
          rm -rf "$work"; mkdir -p "$work"
          curl -sSLf -o "$work/$zip" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/$zip"
          echo "$sum  $work/$zip" | sha256sum -c -
          powershell -NoProfile -Command "Expand-Archive -Force '$work/$zip' '$work/x'"

          bin="$(cd "$work/x/llvm-mingw-$ver-ucrt-aarch64/bin" && pwd -W)"
          # Said out loud: a CC that is not there is a cgo build that falls
          # back to the emulated gcc and fails much later and worse.
          "$bin/aarch64-w64-mingw32-gcc.exe" --version | head -1
          {
            echo "CC=$bin/aarch64-w64-mingw32-gcc.exe"
            echo "CXX=$bin/aarch64-w64-mingw32-g++.exe"
          } >> "$GITHUB_ENV"

      - name: gofmt (window)
        working-directory: gui
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet (window)
        working-directory: gui
        run: go vet ./...

      # The CLI for this cell, by the same script a developer runs, narrowed
      # to one platform. build.sh also clones and patches wireguard-go, which
      # go.mod resolves the tunnel to - nothing in the root module compiles
      # before it has run.
      #
      # ./build.sh rather than `sh build.sh`: it is bash and uses pipefail, and
      # sh on Ubuntu is dash.
      - name: CLI
        shell: bash
        run: PLATFORMS="$TARGET_OS/$TARGET_ARCH" ./build.sh

      - name: Window
        working-directory: gui
        shell: bash
        run: |
          set -eu
          mkdir -p ../dist-gui

          # The stamp build.sh put on the CLI, from the same script. The window
          # and the component refuse to drive each other unless these match.
          VERSION="$(cd .. && sh scripts/version.sh)"
          STAMP="-X github.com/encedo/encedo-wg-hsm/internal/version.Version=$VERSION"
          echo "version: $VERSION"
          # Written down for the jobs that package these binaries elsewhere:
          # the sign job rebuilds the installer from downloaded executables,
          # and the stamp it records has to be theirs. build-msi.sh reads it.
          echo "$VERSION" > ../dist-gui/VERSION

          out="../dist-gui/encedo-wg-gui-$TARGET_OS-$TARGET_ARCH"
          extra=""
          if [ "$TARGET_OS" = windows ]; then
            out="$out.exe"
            # -H=windowsgui: no console window behind the interface.
            extra="-H=windowsgui"

            # The icon and version resource, compiled in: Explorer, the task
            # bar and the Start menu read the icon from the executable. Run
            # from gui/ - -platform-specific ignores -o and writes into the
            # working directory, and Go links a .syso only from the package's
            # own directory. The first attempt ran it from the root and the
            # window shipped with no icon and no error.
            go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1 \
                -icon packaging/icon.ico \
                -product-version "$VERSION" \
                -platform-specific \
                packaging/versioninfo.json
            ls resource_windows_*.syso >/dev/null 2>&1 || {
              echo "goversioninfo produced no .syso in $(pwd)" >&2; exit 1; }
          fi

          # One -ldflags, composed here: passing two silently keeps the last.
          CGO_ENABLED=1 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" \
            go build -ldflags "$STAMP $extra" -o "$out" .
          ls -l ../dist ../dist-gui

      # The same window linked as a console program, so that running it in a
      # terminal prints what Fyne says instead of failing in silence. That is
      # how the arm64 window's failure in the VM was read at all. Kept out of
      # dist-gui/ so that the sign job never signs it and nothing ships it.
      - name: A console copy of the window, for reading its errors
        if: inputs.package && matrix.goos == 'windows'
        working-directory: gui
        shell: bash
        run: |
          set -eu
          mkdir -p ../dist-diag
          VERSION="$(cat ../dist-gui/VERSION)"
          CGO_ENABLED=1 GOARCH="$TARGET_ARCH" go build \
            -ldflags "-X github.com/encedo/encedo-wg-hsm/internal/version.Version=$VERSION" \
            -o "../dist-diag/encedo-wg-gui-windows-$TARGET_ARCH-console.exe" .

      # Windows 10 is one of the machines this ships to, and "will it start
      # there" is answered by the PE header: the minimum OS version and the
      # subsystem version. Go asks for 6.1 today, so there is room, and that
      # is why it is pinned - a toolchain change could raise it, the build
      # would still pass, and the first anyone would know is a machine
      # refusing to run it.
      - name: Everything must still start on Windows 10
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem dist/*.exe, dist-gui/*.exe | ForEach-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            if ([Text.Encoding]::ASCII.GetString($b, $pe, 2) -ne 'PE') {
              throw "$($_.Name): no PE signature where the DOS header points"
            }
            $opt   = $pe + 24
            $osMaj = [BitConverter]::ToUInt16($b, $opt + 40)
            $osMin = [BitConverter]::ToUInt16($b, $opt + 42)
            $ssMaj = [BitConverter]::ToUInt16($b, $opt + 48)
            $ssMin = [BitConverter]::ToUInt16($b, $opt + 50)
            "{0}: minimum OS {1}.{2}, subsystem {3}.{4}" -f $_.Name, $osMaj, $osMin, $ssMaj, $ssMin
            foreach ($v in @(@($osMaj, $osMin), @($ssMaj, $ssMin))) {
              if ($v[0] -gt 10 -or ($v[0] -eq 10 -and $v[1] -gt 0)) {
                Write-Error "$($_.Name) demands Windows $($v[0]).$($v[1]), later than Windows 10"
                $bad = $true
              }
            }
          }
          if ($bad) { exit 1 }

      # The Debian package, from the cell that built both of its halves.
      # build-deb.sh refuses a mismatched pair itself.
      - name: Debian package
        if: inputs.package && matrix.goos == 'linux'
        shell: bash
        run: |
          set -eu
          sh packaging/linux/build-deb.sh "$TARGET_ARCH"
          ls -l dist-deb/

      # A bundle somebody can install rather than four files and a paragraph,
      # with the tunnel driver beside the component - without it the tunnel
      # fails at the moment it is created. Every file is this cell's own.
      - name: Windows bundle
        if: inputs.package && matrix.goos == 'windows'
        shell: bash
        run: |
          set -eu
          # One source of truth for the driver, read out of the script that
          # has always owned it.
          ver="$(sed -n 's/^WINTUN_VERSION="\(.*\)"$/\1/p' package-windows.sh)"
          sum="$(sed -n 's/^WINTUN_SHA256="\(.*\)"$/\1/p' package-windows.sh)"
          # Relative, because this is bash and the extraction is PowerShell,
          # and an absolute /tmp/... means a different place to each.
          work=dist-gui/_wintun
          rm -rf "$work"; mkdir -p "$work"
          curl -sSLf -o "$work/wintun.zip" "https://www.wintun.net/builds/wintun-${ver}.zip"
          # Redistributed to users: verified, not trusted.
          echo "${sum}  $work/wintun.zip" | sha256sum -c -
          powershell -NoProfile -Command "Expand-Archive -Force '$work/wintun.zip' '$work/x'"

          stage="dist-gui/encedo-wg-windows-$TARGET_ARCH"
          mkdir -p "$stage"
          cp "dist/wg-hem-windows-$TARGET_ARCH.exe"            "$stage/wg-hem.exe"
          cp "dist/wg-quick-encedo-windows-$TARGET_ARCH.exe"   "$stage/wg-quick-encedo.exe"
          cp "dist-gui/encedo-wg-gui-windows-$TARGET_ARCH.exe" "$stage/encedo-wg-gui.exe"
          cp "$work/x/wintun/bin/$TARGET_ARCH/wintun.dll"      "$stage/wintun.dll"
          cp packaging/windows/install.ps1                     "$stage/"
          cp packaging/windows/uninstall.ps1                   "$stage/"
          # The icon as a file too: the notification registration wants an
          # image, not an executable.
          cp gui/packaging/icon.ico                            "$stage/"
          cp LICENSE                                           "$stage/LICENSE.txt"
          cp "$work/x/wintun/LICENSE.txt"                      "$stage/WINTUN-LICENSE.txt"
          rm -rf "$work"
          ls -R dist-gui

      # The installer, by a script because the sign job builds it again once
      # the binaries in the stage carry a signature, and the two must not
      # drift. On its own runner, so the component's stamp is checked by
      # running it.
      - name: Windows installer
        if: inputs.package && matrix.goos == 'windows'
        shell: bash
        run: packaging/windows/build-msi.sh "$TARGET_ARCH" "${{ github.run_number }}"

      # Not signed here. Signing needs an OIDC token Azure exchanges only for
      # a job in the "release" environment, which waits for a reviewer - on
      # this job that would put every push behind a person. release.yml signs
      # what this uploads, on a tag or on request.
      - name: Upload
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: encedo-wg-${{ matrix.goos }}-${{ matrix.goarch }}
          # Several roots, so the artifact keeps them as directories.
          path: |
            dist/
            dist-gui/
            dist-deb/
            dist-diag/
          retention-days: 7
