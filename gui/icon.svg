<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The boundary and what stays inside it. The ring is the module, the dot is
       the key, and the key is inside. Neither shape is borrowed from the
       category's shared vocabulary — no padlock, no shield, no globe, no
       keyhole — and it is the window's status dot promoted to a mark, so the
       application and its icon say the same thing in the same colours.

       Proportioned for 16 px, where a tray puts it, not for the size where it
       looks best. The constraint is not the ring's weight but the GAP between
       ring and dot: that gap is what makes the mark read as containment rather
       than as a blob, and it is the first thing to vanish. At 11 units it
       survives as roughly two and a half pixels; a thicker ring with a tighter
       gap tested worse, closing up into a light disc with a speck in it. -->
  <rect width="64" height="64" rx="14" fill="#0A0E0E"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#C7D4CF" stroke-width="6"/>
  <circle cx="32" cy="32" r="8" fill="#47C6A3"/>
</svg>
