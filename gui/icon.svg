<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The boundary and what stays inside it. The ring is the module, the dot is
       the key, and the key is inside. Nothing borrowed from the category's shared
       vocabulary — no padlock, no shield, no globe, no keyhole — and it is the
       window's status dot promoted to a mark, so the application and its icon say
       the same thing in the same colours.

       Proportioned at 16 px, where a tray draws it, and the constraint is the
       GAP rather than the ring: the gap is what makes this containment instead
       of a blob, and it is the first thing to close. So the ring is thinner than
       it would be if the icon were only ever seen large — a sixteenth of the
       width — and the gap takes what it gives up.

       Measured, not guessed. Four weights were rendered at 16 px and magnified:
       at six units the gap all but disappeared and the mark read as a light disc
       with a speck in it; at three the ring itself began to break up under
       antialiasing. Four holds both. -->
  <rect width="64" height="64" rx="14" fill="#0A0E0E"/>
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#C7D4CF" stroke-width="4"/>
  <circle cx="32" cy="32" r="7" fill="#47C6A3"/>
</svg>
