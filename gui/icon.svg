<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The boundary and what stays inside it. The ring is the module, the dot is
       the key, and the key is inside. Nothing borrowed from the category's shared
       vocabulary — no padlock, no shield, no globe, no keyhole — and it is the
       window's status dot promoted to a mark, so the application and its icon say
       the same thing in the same colours.

       Proportioned at 16 px, where a tray draws it, and the constraint is the GAP
       rather than the ring: the gap is what makes this containment instead of a
       blob, and it is the first thing to close. Measured — at six units the gap
       all but vanished, at three the ring broke up under antialiasing.

       Everything outside is transparent, and the ground is a disc rather than a
       rounded rectangle: the rectangle's corners showed as dark chips against a
       tray that has its own background, which no icon controls.

       The disc runs a little past the ring on purpose. Flush with it, the light
       ring met a light tray directly and disappeared into it, leaving a dark
       blob with a green centre. A unit and a half of dark rim separates the mark
       from whatever is behind it without bringing back a corner. -->
  <circle cx="32" cy="32" r="27" fill="#0A0E0E"/>
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#C7D4CF" stroke-width="4"/>
  <circle cx="32" cy="32" r="7" fill="#47C6A3"/>
</svg>
